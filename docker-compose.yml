version: "3.9"

services:
  gasoline_frontend:
    build:
      context: .
      dockerfile: Dockerfile-gasoline-system
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    container_name: gasoline_system_frontend
    ports:
      - "5174:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - gasoline_network

volumes:
  gasoline_data:

networks:
  gasoline_network:
    driver: bridge
